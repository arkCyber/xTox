x-shared-params: &shared_params
  # Fixes various issues when building/running in the docker containers
  # Known fixes:
  #    * Appimage mounting
  #    * Attaching to processes in GDB
  #    * Fix tcl build due to pivot_root
  cap_add:
    - ALL
  # Allows us to run app images from within the context of a docker image
  devices:
    - /dev/fuse:/dev/fuse
  # X11 stuff
  environment:
    DISPLAY: $DISPLAY
    XAUTHORITY: $XAUTHORITY
  volumes:
    - .:/xtox
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ~/.Xauthority:/root/.Xauthority
  user: ${USER_ID:-0}:${GROUP_ID:-0}
  network_mode: host

services:
  archlinux:
    image: xtox_archlinux:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.archlinux
    <<: *shared_params
  debian_old:
    image: xtox_debian_old:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.debian_old
    <<: *shared_params
  debian:
    image: xtox_debian:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.debian
      args:
        DEBIAN_VERSION: stable
    <<: *shared_params
  ubuntu_lts:
    image: xtox_ubuntu:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.ubuntu_lts
    <<: *shared_params
  flatpak:
    image: xtox_flatpak:latest
    # Flatpak build uses pivot_root() in tcl build
    privileged: true
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.flatpak_builder
    <<: *shared_params
  almalinux:
    image: xtox_almalinux:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.almalinux
    <<: *shared_params
  fedora:
    image: xtox_fedora:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.fedora
    <<: *shared_params
  opensuse:
    image: xtox_opensuse:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.opensuse
    <<: *shared_params
  windows_builder:
    image: xtox_windows_builder:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.windows_builder
      args:
        ARCH: x86_64
        WINEARCH: win64
    <<: *shared_params
  windows_builder.i686:
    image: xtox_windows_builder.i686:latest
    build:
      context: ./buildscripts
      dockerfile: docker/Dockerfile.windows_builder
      args:
        ARCH: i686
        WINEARCH: win32
    <<: *shared_params
